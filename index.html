<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Veer Patta Public School Fee Management System - Secure login portal">
  <title>Login - VPPS Fee Management</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">🏫</div>
        <h1>Veer Patta Public School</h1>
        <p>Fee Management System</p>
      </div>

      <div id="alertContainer"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="Enter your email"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
          Login
        </button>
      </form>

      <div class="text-center mt-3">
        <p class="text-secondary" style="font-size: 0.875rem; margin-bottom: 0.5rem;">
          Demo Credentials:
        </p>
        <div style="font-size: 0.875rem; color: var(--text-secondary);">
          <p style="margin: 0.25rem 0;">
            <strong>Principal:</strong> director@vpps.co.in
          </p>
          <p style="margin: 0.25rem 0;">
            <strong>Staff:</strong> reception@vpps.co.in
          </p>
          <p style="margin: 0.25rem 0; font-size: 0.8rem; font-style: italic;">
            (Password will be provided by administrator)
          </p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { login } from './js/auth.js';

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const alertContainer = document.getElementById('alertContainer');

    // Show alert message
    function showAlert(message, type = 'error') {
      const alert = document.createElement('div');
      alert.className = `alert alert-${type} alert-dismissible`;
      alert.innerHTML = `
        ${message}
        <button type="button" class="alert-close" onclick="this.parentElement.remove()">&times;</button>
      `;
      alertContainer.innerHTML = '';
      alertContainer.appendChild(alert);

      // Auto-dismiss after 5 seconds
      setTimeout(() => {
        if (alert.parentElement) {
          alert.remove();
        }
      }, 5000);
    }

    // Handle form submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Validate inputs
      if (!email || !password) {
        showAlert('Please enter both email and password', 'error');
        return;
      }

      // Disable form during login
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';

      try {
        const user = await login(email, password);

        // Show success message
        showAlert('Login successful! Redirecting...', 'success');

        // Redirect based on role
        setTimeout(() => {
          if (user.role === 'parent') {
            window.location.href = 'parent-dashboard.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 1000);
      } catch (error) {
        console.error('Login error:', error);

        // Show user-friendly error messages
        let errorMessage = 'Login failed. Please try again.';

        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
          errorMessage = 'Invalid email or password';
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = 'Invalid email address';
        } else if (error.code === 'auth/too-many-requests') {
          errorMessage = 'Too many failed login attempts. Please try again later.';
        } else if (error.message) {
          errorMessage = error.message;
        }

        showAlert(errorMessage, 'error');

        // Re-enable form
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });

    // Quick fill for demo purposes (development only)
    emailInput.addEventListener('dblclick', () => {
      emailInput.value = 'director@vpps.co.in';
    });
  </script>
</body>
</html>
